<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002f49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ski-Aufenthalt">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.jpg">
<title>Silvia – Ski-Aufenthalt</title>
<style>
:root{--navy:#002f49}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--navy);
  overflow:hidden;
}
#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  background:var(--navy);
  overflow:hidden;
}

/* Jede Seite wird proportional über die volle Breite dargestellt.
   Keine Verzerrung, kein künstliches Strecken. */
.page{
  position:absolute;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--navy);
  padding-bottom:72px;
}
.page.active{display:block}
.page .fullpage{
  display:block;
  width:100vw;
  max-width:none;
  height:auto;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-drag:none;
}

/* Die sichtbare Menüleiste wird separat, unverzerrt und fixiert
   aus dem unteren Teil des jeweiligen Seitenbildes dargestellt. */
.nav-visual{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  overflow:hidden;
  z-index:30;
  background:var(--navy);
}
.nav-visual img{
  position:absolute;
  left:0;
  bottom:0;
  width:100vw;
  height:auto;
  max-width:none;
  display:block;
}

/* Klickzonen exakt über der fixierten Menüleiste */
.nav-click{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:40;
}
.nav-click button{
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
}

/* Interaktive Flächen */
.action{
  position:absolute;
  z-index:20;
  border:0;
  background:transparent;
  cursor:pointer;
}
#giftDiscover{left:7%;right:7%;bottom:13%;height:8%}
#hotelWeb{left:8%;right:8%;bottom:13%;height:7%}
#openGift{right:4%;bottom:14%;width:45%;height:18%}

/* Auf breiten Displays bleibt die App smartphone-breit und mittig.
   Auf dem iPhone nutzt sie immer die komplette Breite. */
@media (min-width:700px){
  #app{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:430px;
  }
  .page .fullpage,.nav-visual img{width:430px}
  .nav-visual,.nav-click{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:430px;
  }
}
</style>
</head>
<body>
<div id="app">

<section class="page active" data-page="start">
  <img class="fullpage" src="./images/start.jpg?v=4" alt="Startseite">
  <button id="giftDiscover" class="action" aria-label="Geschenk entdecken"></button>
</section>

<section class="page" data-page="overview">
  <img class="fullpage" src="./images/overview.jpg?v=4" alt="Überblick">
</section>

<section class="page" data-page="hotel">
  <img class="fullpage" src="./images/hotel.jpg?v=4" alt="Unterkunft">
  <a id="hotelWeb" class="action" href="https://kronechurwalden.ch/" target="_blank" rel="noopener" aria-label="Webseite öffnen"></a>
</section>

<section class="page" data-page="travel">
  <img class="fullpage" src="./images/travel.jpg?v=4" alt="Anreise">
</section>

<section class="page" data-page="gift">
  <img class="fullpage" src="./images/gift.jpg?v=4" alt="Geschenk">
  <button id="openGift" class="action" aria-label="Geschenk öffnen"></button>
</section>

<div class="nav-visual" aria-hidden="true">
  <img id="navImage" src="./images/start.jpg?v=4" alt="">
</div>

<nav class="nav-click" aria-label="Navigation">
  <button data-go="start" aria-label="Start"></button>
  <button data-go="overview" aria-label="Überblick"></button>
  <button data-go="hotel" aria-label="Unterkunft"></button>
  <button data-go="travel" aria-label="Anreise"></button>
  <button data-go="gift" aria-label="Geschenk"></button>
</nav>

</div>

<script>
(function(){
  const pages=[...document.querySelectorAll('.page')];
  const navImage=document.getElementById('navImage');
  const imageMap={
    start:'./images/start.jpg?v=4',
    overview:'./images/overview.jpg?v=4',
    hotel:'./images/hotel.jpg?v=4',
    travel:'./images/travel.jpg?v=4',
    gift:'./images/gift.jpg?v=4'
  };

  function go(name){
    pages.forEach(p=>{
      const active=p.dataset.page===name;
      p.classList.toggle('active',active);
      if(active) p.scrollTop=0;
    });
    navImage.src=imageMap[name];
    history.replaceState(null,'','#'+name);
  }

  document.querySelectorAll('[data-go]').forEach(
    b=>b.addEventListener('click',()=>go(b.dataset.go))
  );

  document.getElementById('giftDiscover').addEventListener('click',()=>go('gift'));
  document.getElementById('openGift').addEventListener(
    'click',()=>alert('Jetzt wartet noch ein weiteres Geschenk auf dich. Öffne es!')
  );

  const initial=location.hash.slice(1);
  if(['start','overview','hotel','travel','gift'].includes(initial)) go(initial);
})();
</script>
</body>
</html>
