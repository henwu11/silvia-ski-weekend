<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#063d66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silvias Ski-Gutschein">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ski-Gutschein für Silvia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5ecd8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{overscroll-behavior:none}.app{position:fixed;inset:0;background:#f5ecd8;display:flex;align-items:flex-start;justify-content:center}.page{position:absolute;inset:0;display:none;justify-content:center;align-items:flex-start;background:#f5ecd8}.page.active{display:flex}.page img{display:block;width:100%;height:100%;object-fit:fill}.tabs{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0);height:13.5vh;z-index:5;display:grid;grid-template-columns:repeat(4,1fr)}.tabs button{border:0;background:transparent;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (min-width:700px){.app{max-width:430px;left:50%;transform:translateX(-50%);box-shadow:0 0 30px #0002}.tabs{max-width:430px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<main class="app" id="app">
<section class="page active" data-page="0"><img src="images/start.jpg" alt="Gutschein für Silvia, 24.01.2027 in Churwalden"></section>
<section class="page" data-page="1"><img src="images/erlebnis.jpg" alt="Dein Ski-Erlebnis"></section>
<section class="page" data-page="2"><img src="images/unterkunft.jpg" alt="Hotel Krone Churwalden, Hauptstraße 155, 7075 Churwalden, Schweiz"></section>
<section class="page" data-page="3"><img src="images/geschenk.jpg" alt="Ein Geschenk für Silvia"></section>
</main>
<nav class="tabs" aria-label="Navigation">
<button data-go="0" aria-label="Start"><span class="sr">Start</span></button><button data-go="1" aria-label="Erlebnis"><span class="sr">Erlebnis</span></button><button data-go="2" aria-label="Unterkunft"><span class="sr">Unterkunft</span></button><button data-go="3" aria-label="Geschenk"><span class="sr">Geschenk</span></button>
</nav>
<script>
const pages=[...document.querySelectorAll('.page')];function go(i){pages.forEach((p,n)=>p.classList.toggle('active',n===i));history.replaceState(null,'','#'+(i+1))}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));let i=Math.max(0,Math.min(3,(parseInt(location.hash.slice(1))||1)-1));go(i);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body></html>
