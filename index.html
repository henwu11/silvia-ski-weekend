<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002f49"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ski-Aufenthalt">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.jpg">
<title>Silvia – Ski-Aufenthalt</title>
<style>
:root{--navy:#002f49;--navy2:#00263b;--cream:#f7eddd;--gold:#c99a43;--ink:#0b3042;--red:#9e2f24}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0;width:100vw;height:100dvh;background:var(--cream);overflow:hidden}
.page{position:absolute;inset:0;display:none;grid-template-rows:auto minmax(0,1fr) 70px;background:var(--cream);overflow:hidden}.page.active{display:grid}
.top{height:54px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.8px;font-size:18px}
.top.blank{color:transparent}
.body{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.hero{width:100%;height:34%;min-height:155px;object-fit:cover;display:block}
.content{flex:1;min-height:0;padding:14px 18px;background:var(--cream);color:var(--ink);overflow:hidden}
.home .hero{height:46%}.home .content{display:flex;flex-direction:column;justify-content:space-evenly;text-align:center;padding:12px 22px 14px;background:var(--navy);color:white}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.8px}.name{font-size:clamp(30px,8vw,42px);font-weight:900;letter-spacing:2px;margin:0}.title{font-size:clamp(23px,6vw,31px);font-weight:850;margin:3px 0}.meta{font-size:14px;font-weight:750}.wish{font-size:15px;font-weight:700}.rule{height:1px;background:#ffffff35;margin:3px 0}
.btn{border:0;border-radius:10px;background:var(--gold);color:#092e42;font-weight:900;padding:13px 15px;font-size:14px;text-decoration:none;text-align:center;display:block}.btn.navy{background:var(--navy);color:white}
.intro{font-size:14px;line-height:1.35;margin:5px 0 10px}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;font-size:13px}.ico{width:25px;height:25px;border-radius:6px;background:var(--navy);color:white;display:grid;place-items:center;font-size:12px}
.portraits{display:flex;gap:8px;align-items:center;margin-top:8px}.portraits img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.note{margin-top:8px;border:1px solid #d5c4aa;border-radius:10px;padding:8px;font-size:12px;text-align:center}
.hotel-title{font-size:23px;font-weight:900}.stars{color:var(--gold);letter-spacing:2px;margin:2px 0 6px}.details{display:grid;gap:6px;font-size:12px;margin:8px 0}
.travel .hero{height:38%}.travel .content{padding-top:10px}.travel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.travel-card{border:1px solid #d2c2a8;border-radius:9px;padding:7px;font-size:10px;line-height:1.25}.route{margin-top:8px;border:1px solid #738b94;border-radius:9px;padding:7px;background:#f4e7d2}.route svg{width:100%;height:82px;display:block}
.gift .body{background:var(--navy)}.gift-hero{height:48%;width:100%;object-fit:cover}.gift .content{background:var(--cream);display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:center}.gift h2{font-size:20px;margin:0 0 6px}.gift p{font-size:12px;line-height:1.35;margin:0}.giftbox{font-size:54px;text-align:center}
.nav{height:70px;background:var(--navy);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:max(0px,env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px}.nav button.active{color:var(--gold);font-weight:800}.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:700px){#app{width:430px;left:50%;right:auto;transform:translateX(-50%);box-shadow:0 0 40px #0008}}
</style></head><body><div id="app"></div>
<script>
const icons={
h:'<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>',
o:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
u:'<svg viewBox="0 0 24 24"><path d="M4 10h16v10H4z"/><path d="M6 10V7h12v3"/></svg>',
a:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8 14 3-5 5 1-3 5z"/></svg>',
g:'<svg viewBox="0 0 24 24"><path d="M4 9h16v11H4z"/><path d="M3 6h18v4H3z"/><path d="M12 6v14"/></svg>'};
const nav=a=>`<nav class="nav">${[['home','h','Hauptseite'],['overview','o','Überblick'],['hotel','u','Unterkunft'],['travel','a','Anreise'],['gift','g','Geschenk']].map(x=>`<button class="${a==x[0]?'active':''}" onclick="go('${x[0]}')">${icons[x[1]]}<span>${x[2]}</span></button>`).join('')}</nav>`;
const route=`<div class="route"><svg viewBox="0 0 360 82"><text x="4" y="18" font-size="13" font-weight="800">BONN</text><circle cx="52" cy="14" r="6" fill="#002f49"/><path d="M60 15 C100 20,105 35,145 31 S205 44,240 42 S290 55,325 59" fill="none" stroke="#002f49" stroke-width="4" stroke-dasharray="8 6"/><circle cx="130" cy="30" r="4" fill="#9e2f24"/><text x="108" y="47" font-size="8">Frankfurt</text><circle cx="205" cy="41" r="4" fill="#9e2f24"/><text x="184" y="58" font-size="8">Stuttgart</text><circle cx="270" cy="50" r="4" fill="#9e2f24"/><text x="257" y="67" font-size="8">Zürich</text><circle cx="329" cy="59" r="6" fill="#9e2f24"/><text x="286" y="78" font-size="11" font-weight="800">CHURWALDEN</text></svg></div>`;
const pages={
home:`<section class="page active home"><header class="top blank">.</header><div class="body"><img class="hero" src="./images/start.jpg?v=6"><div class="content"><div><div class="eyebrow">FÜR</div><div class="name">SILVIA</div></div><div class="rule"></div><div><div class="eyebrow">ERLEBNIS</div><div class="title">Skiaufenthalt</div></div><div class="rule"></div><div class="meta">24.01.2027 · CHURWALDEN</div><div class="wish">♥ Alles Gute zum Geburtstag!</div><button class="btn" onclick="go('gift')">GESCHENK ENTDECKEN ›</button></div></div>${nav('home')}</section>`,
overview:`<section class="page overview"><header class="top">ÜBERBLICK</header><div class="body"><img class="hero" src="./images/overview.jpg?v=6"><div class="content"><div class="eyebrow">DEIN ERLEBNIS</div><div class="title">Skiaufenthalt</div><p class="intro">Freu dich auf eine unvergessliche Zeit in den Bergen – mit Schnee, Sonne und besonderen Momenten.</p><div class="rows"><div class="row"><span class="ico">⛷</span>Skifahren & Winterspaß</div><div class="row"><span class="ico">▲</span>Traumhafte Berglandschaft</div><div class="row"><span class="ico">☕</span>Genuss & Entspannung</div><div class="row"><span class="ico">★</span>Unvergessliche Momente</div></div><div class="note">♡ Wir wünschen dir eine wunderbare Zeit!</div></div></div>${nav('overview')}</section>`,
hotel:`<section class="page hotel"><header class="top">UNTERKUNFT</header><div class="body"><img class="hero" src="./images/hotel.jpg?v=6"><div class="content"><div class="eyebrow">DEINE UNTERKUNFT</div><div class="hotel-title">KRONE CHURWALDEN</div><div class="stars">★★★★★</div><p class="intro">Tradition, Herzlichkeit und Genuss – die Krone Churwalden freut sich auf dich!</p><div class="details"><div>● Hauptstraße 155 · 7075 Churwalden</div><div>◎ kronechurwalden.ch</div><div>☎ +41 81 356 14 14</div><div>✉ info@kronechurwalden.ch</div></div><a class="btn navy" href="https://kronechurwalden.ch/" target="_blank">WEBSITE ÖFFNEN ↗</a></div></div>${nav('hotel')}</section>`,
travel:`<section class="page travel"><header class="top">ANREISE</header><div class="body"><img class="hero" src="./images/travel.jpg?v=6"><div class="content"><div class="eyebrow">DEINE ANREISE</div><div class="title" style="font-size:20px">SO KOMMST DU HIN</div><div class="travel-grid"><div class="travel-card"><b>🚗 AUTO</b><br>ca. 6:30 h<br>ca. 620 km</div><div class="travel-card"><b>🚆 ZUG</b><br>bis Chur<br>weiter per Postauto</div><div class="travel-card"><b>✈ FLUG</b><br>Zürich ZRH<br>ca. 2:15 h</div></div>${route}<div class="note">❄ Schneeketten empfohlen & Winterausrüstung nicht vergessen.</div></div></div>${nav('travel')}</section>`,
gift:`<section class="page gift"><header class="top">GESCHENK</header><div class="body"><img class="gift-hero" src="./images/gift.jpg?v=6"><div class="content"><div><div class="eyebrow">DEIN GESCHENK</div><h2>Ein Skiaufenthalt voller Freude</h2><p>Wir wünschen dir unvergessliche Momente im Schnee.</p></div><div><div class="giftbox">🎁</div><p><b>Jetzt wartet noch ein weiteres Geschenk auf dich.</b></p><button class="btn navy" onclick="alert('Öffne dein Geschenk!')">ÖFFNE ES!</button></div></div></div>${nav('gift')}</section>`};
function go(n){document.getElementById('app').innerHTML=pages[n];history.replaceState(null,'','#'+n)}
const h=location.hash.slice(1);go(['home','overview','hotel','travel','gift'].includes(h)?h:'home');
</script></body></html>
