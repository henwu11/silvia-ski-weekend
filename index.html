<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9dbbc0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silvias Ski-Gutschein">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ski-Gutschein für Silvia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5ecd8;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{overscroll-behavior:none}
.app,.page{position:fixed;inset:0;width:100%;height:100%;height:100dvh}
.page{display:none;background:#f5ecd8;overflow:hidden}
.page.active{display:block}
.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.arrow{position:fixed;z-index:10;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:44px;height:52px;border:0;border-radius:9px;background:rgba(4,58,96,.92);color:#fff;font:300 46px/44px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 5px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px #0003}
.arrow.prev{left:16px}.arrow.next{right:16px}.arrow[hidden]{display:none}
@media(min-width:700px){.app,.page{max-width:430px;left:50%;right:auto;transform:translateX(-50%)}.arrow.prev{left:calc(50% - 199px)}.arrow.next{right:calc(50% - 199px)}}
</style>
</head>
<body>
<main class="app">
<section class="page active"><img src="images/start.jpg" alt="Gutschein für Silvia, 24.01.2027 in Churwalden"></section>
<section class="page"><img src="images/erlebnis.jpg" alt="Dein Ski-Erlebnis"></section>
<section class="page"><img src="images/unterkunft.jpg" alt="Hotel Krone Churwalden, Hauptstraße 155, 7075 Churwalden, Schweiz"></section>
<section class="page"><img src="images/geschenk.jpg" alt="Ein Geschenk für Silvia"></section>
</main>
<button class="arrow prev" id="prev" aria-label="Zurück">‹</button>
<button class="arrow next" id="next" aria-label="Weiter">›</button>
<script>
const pages=[...document.querySelectorAll('.page')],prev=document.getElementById('prev'),next=document.getElementById('next');
let current=Math.max(0,Math.min(3,(parseInt(location.hash.slice(1))||1)-1));
function go(i){current=Math.max(0,Math.min(3,i));pages.forEach((p,n)=>p.classList.toggle('active',n===current));prev.hidden=current===0;next.hidden=current===3;history.replaceState(null,'','#'+(current+1))}
prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));go(current);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body></html>
