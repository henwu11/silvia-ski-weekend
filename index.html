<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#002f49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ski-Aufenthalt">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.jpg">
<title>Silvia – Ski-Aufenthalt</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0!important;
  padding:0!important;
  width:100%;
  min-width:100%;
  height:100%;
  background:#002f49!important;
  overflow:hidden;
}
body{overscroll-behavior:none}
#app{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  margin:0;
  padding:0;
  background:#002f49;
  overflow:hidden;
}
.page{
  position:absolute;
  inset:0;
  display:none;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:#002f49;
  overflow:hidden;
}
.page.active{display:block}
.page img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
}
.nav{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:10%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:20;
  margin:0;
  padding:0;
}
.nav button,.action{
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
  margin:0;
}
.action{position:absolute;z-index:15}
#giftDiscover{left:7%;right:7%;bottom:12%;height:8%}
#hotelWeb{left:8%;right:8%;bottom:12%;height:7%}
#openGift{right:4%;bottom:12%;width:45%;height:19%}
</style>
</head>
<body>
<div id="app">
<section class="page active" data-page="start">
 <img src="./images/start.jpg?v=3" alt="Startseite">
 <button id="giftDiscover" class="action" aria-label="Geschenk entdecken"></button>
</section>
<section class="page" data-page="overview"><img src="./images/overview.jpg?v=3" alt="Überblick"></section>
<section class="page" data-page="hotel">
 <img src="./images/hotel.jpg?v=3" alt="Unterkunft">
 <a id="hotelWeb" class="action" href="https://kronechurwalden.ch/" target="_blank" rel="noopener" aria-label="Webseite öffnen"></a>
</section>
<section class="page" data-page="travel"><img src="./images/travel.jpg?v=3" alt="Anreise"></section>
<section class="page" data-page="gift">
 <img src="./images/gift.jpg?v=3" alt="Geschenk">
 <button id="openGift" class="action" aria-label="Geschenk öffnen"></button>
</section>
<nav class="nav" aria-label="Navigation">
 <button data-go="start" aria-label="Start"></button>
 <button data-go="overview" aria-label="Überblick"></button>
 <button data-go="hotel" aria-label="Unterkunft"></button>
 <button data-go="travel" aria-label="Anreise"></button>
 <button data-go="gift" aria-label="Geschenk"></button>
</nav>
</div>
<script>
(function(){
 const pages=[...document.querySelectorAll('.page')];
 function go(name){
   pages.forEach(p=>p.classList.toggle('active',p.dataset.page===name));
   history.replaceState(null,'','#'+name);
 }
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
 document.getElementById('giftDiscover').addEventListener('click',()=>go('gift'));
 document.getElementById('openGift').addEventListener('click',()=>alert('Jetzt wartet noch ein weiteres Geschenk auf dich. Öffne es!'));
 const h=location.hash.slice(1);
 if(['start','overview','hotel','travel','gift'].includes(h)) go(h);
})();
</script>
</body>
</html>
